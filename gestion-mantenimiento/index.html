      sr=S.units.filter(function(u){return regEstado(u).e==='Sin reportarse'}).length,cv=S.units.filter(function(u){return u.tel&&chkEstado(u)==='Vencido'}).length,old=S.ots.filter(function(o){return o.estado!=='Cerrada'&&diffDays(iso(TD),o.fInicio)>7}).length;
  if(v)a.push(['prev',v+' services vencidos','Creá la orden desde Preventivo.']);

  if(sr)a.push(['reg',sr+' unidades sin reportarse','Más de 3 días sin datos.']);
  if(cv)a.push(['chk',cv+' checklists vencidos','Unidades con Geotab sin inspección vigente en Drive.']);
  var vt=S.units.filter(function(u){return vtvInfo(u).e==='Vencido'}).length,vp=S.units.filter(function(u){return vtvInfo(u).e==='Preaviso'}).length;if(vt)a.push(['vtv',vt+' VTV vencidas','Según Gestión Documental.']);if(vp)a.push(['vtv',vp+' VTV por vencer','En los próximos 30 días.']);
  var fr=pendingDevices().length;if(fr)a.unshift(['ent',fr+' entidades nuevas en Geotab','Sincronizá para traerlas al módulo.']);
  return a}

  setTimeout(function(){if(!done){var a=document.getElementById('gm-app');if(a)a.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><div class="card" style="max-width:460px;text-align:center;padding:30px"><h2 style="color:#00A6E0;margin:0 0 8px">Gestión de Mantenimiento</h2><p style="margin:0">Este módulo se abre desde MyGeotab. Entrá a MyGeotab y buscalo en el menú.</p></div></div>'}},4000);
