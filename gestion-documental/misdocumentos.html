<!-- Gestion Documental - "Mis Documentos" para la app del chofer (MyGeotab Drive)

     Objetivo (pedido por Axel): que CUALQUIER chofer, desde la app Geotab
     Drive, pueda ver la documentacion de CUALQUIER unidad cargada en el
     sistema (no solo "sus" papeles) -- por ejemplo para mostrarle a un
     control caminero la VTV o el seguro del camion que esta manejando ese
     dia, aunque no sea el vehiculo que tiene asignado siempre.

     Por eso esta pantalla NO reutiliza el cruce de "Choferes" (Config >
     Choferes) que sirve para otra cosa (que cada chofer vea sus propios
     papeles personales, tipo carnet/registro). Ese cruce sigue existiendo
     para el dia que se quiera agregar "Mis Papeles" (documentos de tipo
     Operador). Esta pantalla es simplemente: buscar una unidad, ver sus
     documentos. Sin login de chofer, sin edicion -- solo lectura.

     Sigue el mismo patron ya probado en chofer.html (Gestion de Viajes):
       - Registrado en MyGeotab con "path": "DriveAppLink/" para aparecer
         como un item de menu real DENTRO de la app Geotab Drive (a
         diferencia de "path": "GeotabDrive/", que solo lo muestra en
         MyGeotab web).
       - Usa GD.init(api) (mismo motor que index.html, en js/data/store.js)
         para leer los datos ya sincronizados (Firestore + respaldo en
         AddInData + cache en localStorage). NO llama a
         GD.sincronizarConGeotab(): ese metodo hace Get/Device y Get/User
         contra la API de Geotab, y (ver comentario de chofer.html) esas
         llamadas fallan con "Bad request" cuando se ejecutan adentro de
         Drive. La sincronizacion con Geotab (altas de vehiculos/choferes)
         la sigue haciendo el panel del coordinador (index.html) desde
         MyGeotab web; esta pantalla solo LEE lo que ya esta sincronizado.
       - Mismo chequeo defensivo (typeof geotab !== 'undefined' &&
         geotab.addin) que ya usan index.html/chofer.html, para poder abrir
         este archivo suelto en el navegador (afuera de MyGeotab) sin que
         explote con un ReferenceError.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --md-accent:#00A6E0; --md-accent-dark:#0078A1; --md-accent-light:#E3F5FB;
    --md-bg:#F4F5F8; --md-border:#ECEDF2; --md-text:#20232B; --md-muted:#8A8F9C;
    --md-radius:14px; --md-radius-lg:18px;
    --md-shadow:0 2px 10px rgba(17,24,39,.06),0 1px 2px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--md-bg); color:var(--md-text);
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #md-app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  #md-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  #md-header img{height:36px;flex-shrink:0}
  #md-header h1{font-size:1.05rem;margin:0;font-weight:700}
  #md-header p{margin:1px 0 0;font-size:.74rem;color:var(--md-muted)}

  #md-search{position:relative;margin-bottom:14px}
  #md-search input{
    width:100%;padding:11px 14px;border:1.5px solid var(--md-border);border-radius:var(--md-radius);
    font-size:.92rem;font-family:inherit;background:#fff;color:var(--md-text);
  }
  #md-search input:focus{outline:none;border-color:var(--md-accent);box-shadow:0 0 0 3px rgba(0,166,224,.15)}

  #md-tipos{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .md-chip{
    border:1.5px solid var(--md-border);background:#fff;color:var(--md-muted);
    padding:6px 13px;border-radius:999px;font-size:.76rem;font-weight:600;cursor:pointer;
    font-family:inherit;
  }
  .md-chip.md-chip-on{background:var(--md-accent);border-color:var(--md-accent);color:#fff}

  .md-hint{font-size:.82rem;color:var(--md-muted);text-align:center;padding:36px 12px;line-height:1.5}
  .md-error{color:#dc2626;font-weight:600}

  .md-list{display:flex;flex-direction:column;gap:10px}
  .md-unidad-card{
    background:#fff;border:1px solid var(--md-border);border-radius:var(--md-radius-lg);
    padding:14px 16px;box-shadow:var(--md-shadow);cursor:pointer;display:flex;
    align-items:center;justify-content:space-between;gap:10px;
  }
  .md-unidad-card:active{transform:scale(.99)}
  .md-unidad-nombre{font-weight:700;font-size:.94rem}
  .md-unidad-tipo{font-size:.74rem;color:var(--md-muted);margin-top:2px}
  .md-unidad-resumen{display:flex;gap:5px;flex-shrink:0}
  .md-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .md-dot-vigente{background:#059669}
  .md-dot-preaviso{background:#d97706}
  .md-dot-vencido{background:#dc2626}
  .md-dot-faltante{background:#cbd5e1}
  .md-chevron{color:#c3c7d1;flex-shrink:0}

  #md-detalle{display:none}
  #md-volver{
    background:none;border:none;color:var(--md-accent);font-family:inherit;font-weight:600;
    font-size:.88rem;padding:8px 0 14px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  #md-detalle-titulo{font-size:1.1rem;font-weight:700;margin:0 0 2px}
  #md-detalle-sub{font-size:.78rem;color:var(--md-muted);margin:0 0 16px}

  .md-doc-card{
    background:#fff;border:1.5px solid var(--md-border);border-radius:var(--md-radius-lg);
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--md-shadow);
  }
  .md-doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .md-doc-nombre{font-weight:700;font-size:.92rem;line-height:1.3}
  .md-badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .md-badge-vigente{background:#d1fae5;color:#065f46}
  .md-badge-preaviso{background:#fef3c7;color:#78350f}
  .md-badge-vencido{background:#fee2e2;color:#7f1d1d}
  .md-badge-faltante{background:#f3f4f6;color:#6b7280}
  .md-doc-fecha{font-size:.78rem;color:var(--md-muted);margin-top:6px}
  .md-doc-obs{font-size:.78rem;color:#3A3F4B;margin-top:6px;font-style:italic}

  .md-archivos{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .md-archivo-link{
    display:inline-flex;align-items:center;gap:6px;background:var(--md-accent-light);
    color:var(--md-accent-dark);border:1px solid #BFEBFA;border-radius:var(--md-radius);
    padding:7px 12px;font-size:.78rem;font-weight:600;text-decoration:none;
    font-family:inherit;cursor:pointer;
  }
  .md-archivo-link svg{width:14px;height:14px;flex-shrink:0}
  .md-archivos-cargando{font-size:.76rem;color:var(--md-muted);margin-top:8px}
  .md-sin-archivos{font-size:.78rem;color:var(--md-muted);margin-top:8px}

  .md-spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--md-border);
    border-top-color:var(--md-accent);margin:0 auto 10px;animation:md-spin 1s linear infinite;
  }
  @keyframes md-spin{to{transform:rotate(360deg)}}

  /* Visor de archivos: en vez de "descargar" (falla adentro del WebView de
     Geotab Drive, ver comentario en abrirArchivo()), el archivo se muestra
     adentro mismo de la pantalla.

     OJO: esto NO es un overlay con position:fixed. Se probo asi primero y
     el WebView de Geotab Drive no lo respeta -- todo indica que directamente
     IGNORA "position:fixed" (lo trata como si fuera "static"), asi que
     "inset:0" no tiene ningun efecto y el visor terminaba con el tamano de
     su contenido, colgado despues de toda la lista (bloquear el scroll de
     fondo tampoco soluciona nada si el problema es este). La solucion que
     no depende de que el WebView soporte "fixed" es no pedirselo: el visor
     se inserta como un panel mas DENTRO del flujo normal de la pagina,
     justo despues de la tarjeta del documento que se toco (ver
     abrirArchivo), con un alto maximo fijo y su propio scroll interno. */
  #md-visor{
    display:none;background:#14161c;border-radius:var(--md-radius-lg);
    margin:-2px 0 14px;overflow:hidden;flex-direction:column;
    box-shadow:var(--md-shadow);
  }
  #md-visor.md-visor-on{display:flex}
  #md-visor-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;background:#20232B;flex-shrink:0;
  }
  #md-visor-titulo{color:#fff;font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
  .md-visor-btn{
    background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;
    padding:8px 12px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;flex-shrink:0;
  }
  .md-visor-btn:active{background:rgba(255,255,255,.22)}
  .md-visor-btn[hidden]{display:none}
  #md-visor-acciones{display:flex;gap:8px;flex-shrink:0;align-items:center}
  /* Los botones de zoom se agrandan aparte (34x34 minimo, +grande que el
     resto) porque son los que el chofer tiene que poder tocar bien: el
     pellizcar con dos dedos y el doble toque no anduvieron en la app
     Geotab Drive (parece que esa app le gana el gesto a la pagina antes de
     que le llegue, algo esperable en una app pensada para no distraer al
     chofer mientras maneja), asi que estos botones son la unica forma
     confiable de hacer zoom ahi. */
  #md-visor-zoom-grupo{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.08);border-radius:10px;padding:2px;flex-shrink:0}
  #md-visor-zoom-grupo[hidden]{display:none}
  .md-visor-zoom-btn{
    background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:8px;
    width:34px;height:34px;font-family:inherit;font-size:1.15rem;font-weight:700;line-height:1;
    cursor:pointer;
  }
  .md-visor-zoom-btn:active{background:rgba(255,255,255,.28)}
  #md-visor-zoom-pct{color:#fff;font-size:.72rem;font-weight:600;min-width:34px;text-align:center;flex-shrink:0}
  /* max-height (en vez de flex:1 en un contenedor de alto automatico) es lo
     que le da al visor un tamano predecible y su propio scroll interno,
     sin necesitar que el padre tenga una altura fija -- eso es justamente
     lo que fallaba con el overlay de pantalla completa. */
  #md-visor-body{max-height:70vh;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  #md-visor-body img{max-width:100%;border-radius:8px;touch-action:none}
  #md-visor-body canvas{max-width:100%;height:auto;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.4);background:#fff}
  #md-visor-body .md-hint{color:#cbd0da}

  /* Zoom de imagen: mientras esta con zoom (>100%) se cambia el layout del
     visor de "flex centrado" a "bloque con scroll", porque un elemento mas
     ancho que su contenedor dentro de un flex con align-items:center no
     deja hacer scroll hacia el lado que "se esconde" detras del centrado
     -- con text-align:center sobre un bloque normal si se puede scrollear
     libremente en cualquier direccion. */
  #md-visor-body.md-zoom-activo{display:block;text-align:center}
  #md-visor-body.md-zoom-activo img{display:inline-block;max-width:none;transition:width .08s linear}
</style>
</head>
<body>
<div id="md-app">

  <div id="md-header">
    <img src="https://axel-valle-22.github.io/geotab-gestion-viajes/logo-tdp.png" alt="Transportes Dolores Parra">
    <div>
      <h1>Mis Documentos</h1>
      <p>DoloresParra S.A. &middot; Documentacion por unidad</p>
    </div>
  </div>

  <!-- ---------------- Vista lista de unidades ---------------- -->
  <div id="md-lista-vista">
    <div id="md-search">
      <input type="text" id="md-input-buscar" placeholder="Buscar por patente o nombre..." autocomplete="off">
    </div>
    <div id="md-tipos">
      <button type="button" class="md-chip md-chip-on" data-tipo="">Todas</button>
      <button type="button" class="md-chip" data-tipo="Vehiculo">Vehiculos</button>
      <button type="button" class="md-chip" data-tipo="AnexoVehicular">Acoplados</button>
    </div>
    <div id="md-lista"><div class="md-hint"><div class="md-spinner"></div>Cargando unidades...</div></div>
  </div>

  <!-- ---------------- Vista detalle de una unidad ---------------- -->
  <div id="md-detalle">
    <button type="button" id="md-volver">&larr; Volver a la lista</button>
    <h2 id="md-detalle-titulo"></h2>
    <p id="md-detalle-sub"></p>
    <div id="md-detalle-docs"></div>
  </div>

</div>

<!-- Visor de archivos (imagen o PDF), en vez de intentar "descargar" -->
<div id="md-visor">
  <div id="md-visor-header">
    <div id="md-visor-titulo"></div>
    <div id="md-visor-acciones">
      <div id="md-visor-zoom-grupo" hidden>
        <button type="button" class="md-visor-zoom-btn" id="md-visor-zoom-menos" aria-label="Alejar">&minus;</button>
        <span id="md-visor-zoom-pct">100%</span>
        <button type="button" class="md-visor-zoom-btn" id="md-visor-zoom-mas" aria-label="Acercar">&plus;</button>
      </div>
      <button type="button" class="md-visor-btn" id="md-visor-descargar">Descargar</button>
      <button type="button" class="md-visor-btn" id="md-visor-cerrar">Cerrar</button>
    </div>
  </div>
  <div id="md-visor-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(typeof pdfjsLib !== 'undefined'){ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }</script>
<script src="js/firebase-config.js"></script>
<script src="js/data/store.js"></script>
<script>
(function(){
  'use strict';

  var ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  var ESTADO_LABEL = { vigente:'Vigente', preaviso:'Preaviso', vencido:'Vencido', faltante:'Faltante' };

  var gApi = null;
  var gTipoFiltro = '';
  var gTextoFiltro = '';
  var gBuscarTimer = null;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fmtFecha(ts){
    return ts ? new Date(ts).toLocaleDateString('es-AR') : '-';
  }

  function fmtBytes(n){
    if(!n) return '';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
  }

  // ---------------- Visor de archivos ----------------
  //
  // Adentro de la app Geotab Drive (Android), un <a href="data:...(base64
  // largo)" download> tira "Download failed": el WebView embebido de Drive
  // no tiene enganchado un manejador de descargas nativo (DownloadManager)
  // para data URIs, a diferencia de un navegador normal. La solucion no es
  // "arreglar la descarga" -- es no depender de ella: el archivo se muestra
  // directamente adentro de esta misma pantalla (imagen o PDF renderizado
  // con pdf.js), que es ademas lo que un chofer necesita en la practica
  // (mostrarselo a un control caminero), y se deja "Descargar" como boton
  // aparte para cuando si funciona (navegador normal, MyGeotab web, etc.).

  var gArchivoActual = null; // { nombre, tipo, dataUrl }

  function dataUrlABlob(dataUrl){
    var partes = dataUrl.split(',');
    var meta = partes[0] || '';
    var b64 = partes[1] || '';
    var mimeMatch = meta.match(/data:([^;]+)/);
    var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    var binario = atob(b64);
    var bytes = new Uint8Array(binario.length);
    for(var i = 0; i < binario.length; i++){ bytes[i] = binario.charCodeAt(i); }
    return new Blob([bytes], { type: mime });
  }

  function cerrarVisor(){
    var visor = document.getElementById('md-visor');
    visor.classList.remove('md-visor-on');
    document.getElementById('md-visor-body').innerHTML = '';
    gArchivoActual = null;
    resetZoom();
    // El visor se movio (insertAdjacentElement) adentro de la lista de
    // documentos al abrirse -- si se queda ahi y despues se entra a OTRA
    // unidad, "cont.innerHTML = ..." en abrirDetalle() lo borraria del DOM
    // para siempre (getElementById('md-visor') pasaria a devolver null). Se
    // lo devuelve a upa, como ultimo hijo de <body>, que nunca se reescribe
    // entero.
    document.body.appendChild(visor);
  }

  // ---------------- Zoom de imagen (pellizcar, doble toque o botones) ----------------
  //
  // Un zoom con "transform:scale()" no sirve aca: al ser puramente visual
  // (no cambia el tamaño de layout), el contenedor con overflow:auto no se
  // entera de que hay mas para scrollear y el zoom queda "pegado" sin poder
  // recorrer la imagen agrandada. Por eso se hace cambiando el ancho real
  // de la imagen (width en %) -- el navegador arma solo el scroll para
  // recorrerla con el dedo, sin JS extra para el paneo.
  var gZoomImg = null;
  var gZoomPct = 100;
  var ZOOM_MIN = 100, ZOOM_MAX = 400, ZOOM_PASO = 60;

  function actualizarBotonesZoom(){
    var grupo = document.getElementById('md-visor-zoom-grupo');
    if(!grupo) return;
    grupo.hidden = !gZoomImg;
    var pct = document.getElementById('md-visor-zoom-pct');
    if(pct) pct.textContent = Math.round(gZoomPct) + '%';
  }

  function aplicarZoom(pct){
    if(!gZoomImg) return;
    pct = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pct));
    gZoomPct = pct;
    gZoomImg.style.width = pct + '%';
    document.getElementById('md-visor-body').classList.toggle('md-zoom-activo', pct > 100);
    actualizarBotonesZoom(); // refresca el "100%"/etc, ademas de mostrar/ocultar el grupo
  }

  function resetZoom(){
    gZoomImg = null;
    gZoomPct = 100;
    document.getElementById('md-visor-body').classList.remove('md-zoom-activo');
    actualizarBotonesZoom();
  }

  function distanciaEntreToques(touches){
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function activarZoomImagen(img){
    gZoomImg = img;
    gZoomPct = 100;
    actualizarBotonesZoom();

    // El paneo (recorrer la imagen agrandada con el dedo) se hace a mano
    // moviendo scrollLeft/scrollTop del contenedor, en vez de dejarselo al
    // scroll nativo del navegador: como el gesto de pellizcar (2 dedos)
    // necesita "e.preventDefault()" en touchmove para no disparar el zoom
    // nativo de la pagina a la vez, el arrastre de 1 dedo tambien queda
    // interceptado -- si no se reimplementa el paneo a mano, la imagen
    // agrandada queda sin forma de recorrerla.
    var cont = document.getElementById('md-visor-body');
    var pinch = null; // { dist, pct } al empezar a pellizcar con 2 dedos
    var pan = null;   // { x, y, movido } al arrastrar con 1 dedo
    var ultimoToqueTs = 0;

    img.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){
        pinch = { dist: distanciaEntreToques(e.touches), pct: gZoomPct };
        pan = null;
      }else if(e.touches.length === 1){
        pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, movido: false };
      }
      e.preventDefault();
    }, { passive:false });

    img.addEventListener('touchmove', function(e){
      if(pinch && e.touches.length === 2){
        aplicarZoom(pinch.pct * (distanciaEntreToques(e.touches) / pinch.dist));
      }else if(pan && e.touches.length === 1){
        var t = e.touches[0];
        var dx = t.clientX - pan.x, dy = t.clientY - pan.y;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) pan.movido = true;
        cont.scrollLeft -= dx;
        cont.scrollTop -= dy;
        pan.x = t.clientX; pan.y = t.clientY;
      }
      e.preventDefault();
    }, { passive:false });

    img.addEventListener('touchend', function(e){
      if(e.touches.length < 2) pinch = null;
      if(e.touches.length === 0){
        if(pan && !pan.movido){
          var ahora = Date.now();
          if(ahora - ultimoToqueTs < 300){ aplicarZoom(gZoomPct > 100 ? 100 : 220); }
          ultimoToqueTs = ahora;
        }
        pan = null;
      }
    });

    // Doble click para cuando se abre esta pantalla desde una computadora.
    img.addEventListener('dblclick', function(){ aplicarZoom(gZoomPct > 100 ? 100 : 220); });
  }

  async function descargarArchivoActual(){
    if(!gArchivoActual) return;
    var nombre = gArchivoActual.nombre || 'documento';
    var blob;
    try{
      blob = dataUrlABlob(gArchivoActual.dataUrl);
    }catch(err){
      alert('No se pudo preparar el archivo para descargar.');
      return;
    }

    // El boton "Descargar" con <a download> (aunque sea con un Blob en vez
    // de la data URI cruda) tampoco funciona adentro del WebView de Geotab
    // Drive: ese WebView no tiene enganchado un DownloadManager para poder
    // guardar el archivo. Lo que SI suelen resolver estos WebViews (porque
    // lo maneja el motor del navegador, no la app anfitriona) es la bandeja
    // nativa "Compartir" de Android (Web Share API con archivos): desde ahi
    // el chofer puede elegir "Guardar en Archivos", mandarlo por WhatsApp,
    // por mail, etc. Por eso se intenta primero esto, y solo si no esta
    // disponible (por ejemplo en una computadora) se cae a la descarga
    // clasica.
    var archivo = null;
    try{ archivo = new File([blob], nombre, { type: blob.type || gArchivoActual.tipo || 'application/octet-stream' }); }catch(e){ archivo = null; }

    if(archivo && navigator.canShare && navigator.canShare({ files: [archivo] })){
      try{
        await navigator.share({ files: [archivo], title: nombre });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return; // el chofer cerro el cartel de compartir, no es un error
        // si compartir falla por otro motivo, probamos con la descarga clasica de abajo
      }
    }

    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    }catch(err){
      alert('No se pudo descargar ni compartir el archivo en este dispositivo. Podés verlo directamente desde esta pantalla, o abrir esta pagina desde una computadora para descargarlo.');
    }
  }

  async function abrirArchivo(a, origenBtn){
    gArchivoActual = a;
    var visor = document.getElementById('md-visor');
    var body = document.getElementById('md-visor-body');
    resetZoom();
    document.getElementById('md-visor-titulo').textContent = a.nombre || 'Documento';
    body.innerHTML = '<div class="md-hint"><div class="md-spinner"></div>Cargando...</div>';
    body.scrollTop = 0;

    // El visor se inserta en el flujo normal de la pagina, justo despues de
    // la tarjeta del documento que se toco, en vez de mostrarse como un
    // overlay a pantalla completa (position:fixed) -- ver el comentario
    // grande arriba de "#md-visor" en el <style>: ese overlay no funcionaba
    // en el WebView de Geotab Drive pase lo que pase con el scroll, porque
    // todo indica que ahi "position:fixed" se ignora directamente. Insertado
    // en el flujo, el navegador lo dibuja siempre donde corresponde (es
    // contenido normal de la pagina, no un overlay), y ademas es justo
    // donde el chofer ya esta mirando.
    var tarjeta = origenBtn && origenBtn.closest('.md-doc-card');
    if(tarjeta) tarjeta.insertAdjacentElement('afterend', visor);
    visor.classList.add('md-visor-on');
    // scrollIntoView (en vez de dejar que el chofer lo encuentre solo) por
    // si el documento tocado no estaba del todo a la vista -- funciona
    // aunque el visor ya no dependa de "fixed": es scroll normal de la
    // pagina hacia un elemento, que si funciona bien en este WebView.
    visor.scrollIntoView({ block:'start', behavior:'smooth' });

    var esImagen = (a.tipo || '').indexOf('image/') === 0;
    var esPdf = (a.tipo || '') === 'application/pdf' || /\.pdf$/i.test(a.nombre || '');

    if(esImagen){
      // width:100% (en vez de solo max-width:100%) para que ocupe todo el
      // ancho de la pantalla del celular en vez de quedar mas chica.
      body.innerHTML = '<img src="' + a.dataUrl + '" alt="' + escapeHtml(a.nombre || '') + '" style="width:100%;height:auto;">';
      activarZoomImagen(body.querySelector('img'));
      return;
    }

    if(esPdf){
      if(typeof pdfjsLib === 'undefined'){
        body.innerHTML = '<p class="md-hint">No se pudo cargar el visor de PDF. Probá con el boton Descargar, o abrí esta pantalla desde una computadora.</p>';
        return;
      }
      try{
        var b64 = (a.dataUrl.split(',')[1] || '');
        var binario = atob(b64);
        var bytes = new Uint8Array(binario.length);
        for(var i = 0; i < binario.length; i++){ bytes[i] = binario.charCodeAt(i); }
        var pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        body.innerHTML = '';
        // El ancho de render se calcula segun el ancho real disponible en
        // la pantalla (el celular del chofer), no un "scale" fijo pensado
        // para monitor de escritorio -- asi la pagina entra justo en el
        // ancho de la pantalla apenas se abre, sin tener que hacer zoom.
        // Se usa devicePixelRatio para que igual se vea nitido.
        var anchoDisponible = Math.max(body.clientWidth - 4, 240);
        var dpr = window.devicePixelRatio || 1;
        for(var p = 1; p <= pdf.numPages; p++){
          var pagina = await pdf.getPage(p);
          var viewportBase = pagina.getViewport({ scale: 1 });
          var factor = anchoDisponible / viewportBase.width;
          var viewport = pagina.getViewport({ scale: factor * dpr });
          var canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = Math.round(viewportBase.width * factor) + 'px';
          canvas.style.height = Math.round(viewportBase.height * factor) + 'px';
          body.appendChild(canvas);
          await pagina.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        }
      }catch(err){
        body.innerHTML = '<p class="md-hint md-error">No se pudo mostrar el PDF (' + escapeHtml(err.message || '') + '). Probá con el boton Descargar.</p>';
      }
      return;
    }

    // Tipo desconocido: no hay forma confiable de "mostrarlo" adentro de la
    // pantalla, asi que la unica opcion es ofrecer la descarga.
    body.innerHTML = '<p class="md-hint">Este tipo de archivo no se puede previsualizar aca. Usá el boton Descargar.</p>';
  }

  // ---------------- Vista lista de unidades ----------------

  async function renderLista(){
    var box = document.getElementById('md-lista');
    box.innerHTML = '<div class="md-hint"><div class="md-spinner"></div>Cargando unidades...</div>';
    var items;
    try{
      items = await GD.listarEntidades({ texto: gTextoFiltro || null, tipo: gTipoFiltro || null });
    }catch(err){
      box.innerHTML = '<p class="md-hint md-error">No se pudo cargar la lista de unidades: ' + escapeHtml(err.message) + '</p>';
      return;
    }
    // "Mis Documentos" es para ver papeles de unidades (vehiculos/acoplados),
    // no de choferes: si no hay filtro de tipo puesto igual se excluyen los
    // Operador para no mezclar documentacion personal en esta pantalla.
    items = items.filter(function(e){ return e.tipo !== 'Operador'; });

    if(!items.length){
      box.innerHTML = '<p class="md-hint">No se encontraron unidades' + (gTextoFiltro ? ' para "' + escapeHtml(gTextoFiltro) + '"' : '') + '.</p>';
      return;
    }

    var docsPorEntidad = {};
    await Promise.all(items.map(function(e){
      return GD.listarDocumentosDeEntidad(e.id).then(function(docs){ docsPorEntidad[e.id] = docs; });
    }));

    box.innerHTML = '<div class="md-list">' + items.map(function(e){
      var docs = docsPorEntidad[e.id] || [];
      var estados = { vigente:0, preaviso:0, vencido:0, faltante:0 };
      docs.forEach(function(d){ if(d.estado && estados[d.estado] != null) estados[d.estado]++; });
      var puntos = ['vencido','preaviso','faltante','vigente']
        .filter(function(k){ return estados[k] > 0; })
        .map(function(k){ return '<span class="md-dot md-dot-' + k + '" title="' + estados[k] + ' ' + ESTADO_LABEL[k] + '"></span>'; })
        .join('');
      return '' +
        '<div class="md-unidad-card" data-id="' + e.id + '">' +
          '<div>' +
            '<div class="md-unidad-nombre">' + escapeHtml(e.descripcion || '(sin nombre)') + '</div>' +
            '<div class="md-unidad-tipo">' + escapeHtml(e.tipo || '') + (docs.length ? ' &middot; ' + docs.length + ' documento(s)' : '') + '</div>' +
          '</div>' +
          '<div class="md-unidad-resumen">' + puntos + '</div>' +
        '</div>';
    }).join('') + '</div>';

    box.querySelectorAll('.md-unidad-card').forEach(function(card){
      card.addEventListener('click', function(){ abrirDetalle(card.getAttribute('data-id')); });
    });
  }

  // ---------------- Vista detalle ----------------

  async function abrirDetalle(entidadId){
    cerrarVisor(); // asegura que el visor no quede adentro de #md-detalle-docs antes de reescribirlo
    document.getElementById('md-lista-vista').style.display = 'none';
    var detalle = document.getElementById('md-detalle');
    detalle.style.display = 'block';
    document.getElementById('md-detalle-titulo').textContent = 'Cargando...';
    document.getElementById('md-detalle-sub').textContent = '';
    document.getElementById('md-detalle-docs').innerHTML = '<div class="md-hint"><div class="md-spinner"></div>Cargando documentos...</div>';

    var entidad, documentos;
    try{
      entidad = await GD.getEntidad(entidadId);
      documentos = await GD.listarDocumentosDeEntidad(entidadId);
    }catch(err){
      document.getElementById('md-detalle-docs').innerHTML = '<p class="md-hint md-error">No se pudieron cargar los documentos: ' + escapeHtml(err.message) + '</p>';
      return;
    }
    if(!entidad){
      document.getElementById('md-detalle-titulo').textContent = 'Unidad no encontrada';
      document.getElementById('md-detalle-docs').innerHTML = '';
      return;
    }

    document.getElementById('md-detalle-titulo').textContent = entidad.descripcion || '(sin nombre)';
    document.getElementById('md-detalle-sub').textContent = entidad.tipo || '';

    var cont = document.getElementById('md-detalle-docs');
    if(!documentos.length){
      cont.innerHTML = '<p class="md-hint">Todavia no hay documentos cargados para esta unidad.</p>';
      return;
    }

    // Orden: primero lo que necesita atencion (vencido/preaviso/faltante), despues lo vigente.
    var orden = { vencido:0, preaviso:1, faltante:2, vigente:3 };
    documentos.sort(function(a,b){
      return (orden[a.estado] != null ? orden[a.estado] : 9) - (orden[b.estado] != null ? orden[b.estado] : 9);
    });

    cont.innerHTML = documentos.map(function(d){
      var estado = d.estado || 'faltante';
      var vencTxt = d.sinVencimiento ? 'Sin vencimiento' : (d.fechaHasta ? 'Vence: ' + fmtFecha(d.fechaHasta) : 'Sin fecha cargada');
      return '' +
        '<div class="md-doc-card" data-doc-id="' + d.id + '">' +
          '<div class="md-doc-top">' +
            '<div class="md-doc-nombre">' + escapeHtml(d.tipoDocumentoNombre || d.tipoDocumentoId || 'Documento') + '</div>' +
            '<span class="md-badge md-badge-' + estado + '">' + (ESTADO_LABEL[estado] || estado) + '</span>' +
          '</div>' +
          '<div class="md-doc-fecha">' + vencTxt + '</div>' +
          (d.observaciones ? '<div class="md-doc-obs">' + escapeHtml(d.observaciones) + '</div>' : '') +
          '<div class="md-archivos" data-archivos-de="' + d.id + '">' +
            ((d.archivos && d.archivos.length)
              ? '<div class="md-archivos-cargando">Cargando archivos...</div>'
              : '<div class="md-sin-archivos">Sin archivos adjuntos.</div>') +
          '</div>' +
        '</div>';
    }).join('');

    // Los archivos (con su dataUrl para poder verlos/descargarlos) viven
    // aparte de gd_data/main (ver comentario grande en store.js: es para no
    // inflar el documento que se sincroniza entero por Firestore), asi que
    // se piden solo para los documentos que realmente tienen algo adjunto,
    // y solo al entrar a esta unidad (no en la lista, para no pedir de mas).
    documentos.filter(function(d){ return d.archivos && d.archivos.length; }).forEach(function(d){
      GD.listarArchivos(d.id).then(function(archivos){
        var box = cont.querySelector('[data-archivos-de="' + d.id + '"]');
        if(!box) return;
        if(!archivos.length){ box.innerHTML = '<div class="md-sin-archivos">Sin archivos adjuntos.</div>'; return; }
        box.innerHTML = archivos.map(function(a, idx){
          return '<button type="button" class="md-archivo-link" data-archivo-idx="' + idx + '">' +
            ICON_FILE + '<span>' + escapeHtml(a.nombre) + (a.tamanoBytes ? ' (' + fmtBytes(a.tamanoBytes) + ')' : '') + '</span></button>';
        }).join('');
        box.querySelectorAll('.md-archivo-link').forEach(function(btn){
          btn.addEventListener('click', function(){
            abrirArchivo(archivos[Number(btn.getAttribute('data-archivo-idx'))], btn);
          });
        });
      }).catch(function(err){
        var box = cont.querySelector('[data-archivos-de="' + d.id + '"]');
        if(box) box.innerHTML = '<div class="md-sin-archivos md-error">No se pudieron cargar los archivos.</div>';
      });
    });
  }

  function cerrarDetalle(){
    cerrarVisor(); // por si quedo abierto: lo devuelve a upa antes de irse (ver comentario en cerrarVisor)
    document.getElementById('md-detalle').style.display = 'none';
    document.getElementById('md-lista-vista').style.display = 'block';
  }

  // ---------------- Eventos de filtro ----------------

  function setupEvents(){
    document.getElementById('md-volver').addEventListener('click', cerrarDetalle);
    document.getElementById('md-visor-cerrar').addEventListener('click', cerrarVisor);
    document.getElementById('md-visor-descargar').addEventListener('click', descargarArchivoActual);
    document.getElementById('md-visor-zoom-mas').addEventListener('click', function(){ aplicarZoom(gZoomPct + ZOOM_PASO); });
    document.getElementById('md-visor-zoom-menos').addEventListener('click', function(){ aplicarZoom(gZoomPct - ZOOM_PASO); });

    document.getElementById('md-input-buscar').addEventListener('input', function(e){
      var val = e.target.value;
      clearTimeout(gBuscarTimer);
      gBuscarTimer = setTimeout(function(){ gTextoFiltro = val; renderLista(); }, 250);
    });

    document.querySelectorAll('#md-tipos .md-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('#md-tipos .md-chip').forEach(function(c){ c.classList.remove('md-chip-on'); });
        chip.classList.add('md-chip-on');
        gTipoFiltro = chip.getAttribute('data-tipo') || '';
        renderLista();
      });
    });
  }

  // ---------------- Arranque (ciclo de vida del Add-In) ----------------

  function doInit(api){
    if(window._mdInitDone === 'real') return; // evita doble inicializacion (Drive a veces reintenta)
    window._mdInitDone = api ? 'real' : 'null';
    gApi = api;
    setupEvents();
    GD.init(gApi).then(function(){
      renderLista();
      GD.onChange(function(){
        // Si se esta viendo el detalle de una unidad, no la cerramos solos
        // por un cambio en tiempo real; alcanza con refrescar la lista de
        // fondo para cuando la persona vuelva atras.
        if(document.getElementById('md-detalle').style.display !== 'block') renderLista();
      });
    });
  }

  if(typeof geotab !== 'undefined' && geotab.addin){
    geotab.addin.gestionDocumentalMisDocumentos = function(){
      return {
        initialize: function(api, state, callback){ doInit(api); if(typeof callback === 'function') callback(); },
        focus: function(){},
        blur: function(){},
      };
    };
  }

  // Permite abrir este archivo suelto en un navegador (fuera de MyGeotab)
  // para probarlo: sin api, GD.init() sigue funcionando con localStorage.
  setTimeout(function(){ if(typeof window._mdInitDone === 'undefined') doInit(null); }, 800);

})();
</script>
