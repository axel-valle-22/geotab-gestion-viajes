<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Estas tres etiquetas le piden al que la muestre que NO guarde una copia
       vieja de esta pagina (mismo criterio ya usado en misdocumentos-v2.html
       tras detectarse que Geotab Drive podia quedarse con una version vieja
       cacheada aunque el archivo publicado ya estuviera actualizado). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gestión Documental</title>
  <link rel="stylesheet" href="css/styles.css?v=13" />

  <!-- Firebase se carga dinámicamente desde store.js (mismo CDN/versión que
       usa Gestión de Viajes), no hace falta declararlo acá. -->

  <!-- El "?v=" al final de cada script/CSS de acá abajo es un cache-buster
       manual: GitHub Pages y el navegador cachean estos archivos por su URL
       exacta, así que sin esto un cambio recién publicado puede tardar en
       verse (incluso con Ctrl+Shift+R, porque el iframe del Add-In dentro de
       MyGeotab no siempre repite la recarga forzada para sus propios
       recursos). Subir el número (o poner la fecha del cambio) en este
       archivo fuerza a bajar la versión nueva de todos los .js/.css. -->
</head>
<body>
  <div id="gd-root">
    <nav id="gd-nav">
      <div class="gd-nav-brand">
        <img class="gd-nav-logo" src="https://axel-valle-22.github.io/geotab-gestion-viajes/logo-tdp.png" alt="Transportes Dolores Parra" />
        <div class="gd-nav-title">Gestión Documental</div>
      </div>

      <button data-view="indicadores" class="gd-nav-btn active">Indicadores</button>

      <div class="gd-nav-group" data-group="documentos">
        <button type="button" class="gd-nav-section-toggle" data-nav-toggle aria-expanded="false">
          <span>Documentos</span>
          <span class="gd-nav-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div class="gd-nav-group-body">
          <button data-view="entidades" class="gd-nav-btn">Entidades</button>
          <button data-view="seguros" class="gd-nav-btn">Seguros</button>
          <button data-view="eliminados" class="gd-nav-btn">Eliminados</button>
        </div>
      </div>

      <div class="gd-nav-group" data-group="notificaciones">
        <button type="button" class="gd-nav-section-toggle" data-nav-toggle aria-expanded="false">
          <span>Notificaciones</span>
          <span class="gd-nav-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div class="gd-nav-group-body">
          <button data-view="alertas" class="gd-nav-btn">Alertas</button>
          <button data-view="reportes" class="gd-nav-btn">Reportes</button>
        </div>
      </div>

      <div class="gd-nav-group" data-group="configuracion">
        <button type="button" class="gd-nav-section-toggle" data-nav-toggle aria-expanded="false">
          <span>Configuración</span>
          <span class="gd-nav-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div class="gd-nav-group-body">
          <button data-view="tiposDocumento" class="gd-nav-btn">Tipos de Documento</button>
          <button data-view="funciones" class="gd-nav-btn">Funciones</button>
          <button data-view="usuarios" class="gd-nav-btn">Choferes</button>
          <button data-view="auditoria" class="gd-nav-btn">Auditoría</button>
        </div>
      </div>

      <button id="gd-btn-sync" class="gd-nav-btn" style="margin-top:10px;border-top:1px solid var(--gd-nav-border);padding-top:14px;border-radius:var(--gd-radius);">⟳ Sincronizar con Geotab</button>
      <div class="gd-nav-status" id="gd-auth-status">Conectando…</div>
      <!-- Medidor de almacenamiento (ver GD.usoAlmacenamiento en store.js). -->
      <div id="gd-almacenamiento" style="padding:0 18px 14px;font-size:.72rem;color:var(--gd-nav-text-muted)"></div>
    </nav>
    <main id="gd-content">Cargando…</main>
  </div>

  <!-- pdf.js + jsPDF: usados por comprimirPdf() en store.js para achicar
       PDF pesados (escaneos) automáticamente antes de guardarlos, igual
       que ya se hace con las fotos. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="js/firebase-config.js?v=13"></script>
  <!-- Optimizador de PDF sin pérdida (usa pdf-lib/pako de cdnjs, que se
       cargan solos recién cuando hace falta): store.js lo prueba antes de
       rasterizar un PDF pesado. -->
  <script src="js/data/pdf-optimizador.js?v=13"></script>
  <script src="js/data/store.js?v=13"></script>
  <script src="js/geotab-api.js?v=13"></script>
  <script src="js/views/indicadores.js?v=13"></script>
  <script src="js/views/entidades.js?v=13"></script>
  <script src="js/views/seguros.js?v=13"></script>
  <script src="js/views/eliminados.js?v=13"></script>
  <script src="js/views/alertas.js?v=13"></script>
  <script src="js/views/reportes.js?v=13"></script>
  <script src="js/views/tiposDocumento.js?v=13"></script>
  <script src="js/views/funciones.js?v=13"></script>
  <script src="js/views/usuarios.js?v=13"></script>
  <script src="js/views/auditoria.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
  <script>
    // Medidor de almacenamiento: se actualiza solo con cada cambio de datos.
    (function () {
      function mb(b) { return b >= 1024 * 1024 * 1024 ? (b / 1024 / 1024 / 1024).toFixed(2) + " GB" : Math.round(b / 1024 / 1024) + " MB"; }
      function pintar() {
        var box = document.getElementById("gd-almacenamiento");
        if (!box || !window.GD || !GD.usoAlmacenamiento) return;
        var u = GD.usoAlmacenamiento();
        var pct = Math.min(100, Math.round(u.porcentaje * 100));
        var color = pct >= 90 ? "#dc2626" : pct >= 70 ? "#f59e0b" : "#16a34a";
        var aviso = pct >= 90 ? "Casi lleno: borrá archivos viejos o pasá a un plan pago."
                  : pct >= 70 ? "Atención: más del 70% usado." : "";
        box.innerHTML =
          '<div style="margin-bottom:4px">Almacenamiento: ' + mb(u.usados) + " de " + mb(u.limite) + " (" + pct + "%)</div>" +
          '<div style="height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden">' +
            '<div style="height:100%;width:' + Math.max(pct, 1) + "%;background:" + color + '"></div></div>' +
          '<div style="margin-top:4px">' + u.cantidadArchivos + " archivo(s)" + (aviso ? ' · <b style="color:' + color + '">' + aviso + "</b>" : "") + "</div>";
      }
      var intentos = 0;
      (function esperarGD() {
        if (window.GD && GD.onChange && GD.usoAlmacenamiento) { GD.onChange(pintar); pintar(); setInterval(pintar, 30000); }
        else if (intentos++ < 100) setTimeout(esperarGD, 300);
      })();
    })();
  </script>
</body>
</html>
