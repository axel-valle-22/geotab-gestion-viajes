<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión Documental</title>
  <link rel="stylesheet" href="css/styles.css?v=3" />

  <!-- Firebase se carga dinámicamente desde store.js (mismo CDN/versión que
       usa Gestión de Viajes), no hace falta declararlo acá. -->

  <!-- El "?v=" al final de cada script/CSS de acá abajo es un cache-buster
       manual: GitHub Pages y el navegador cachean estos archivos por su URL
       exacta, así que sin esto un cambio recién publicado puede tardar en
       verse (incluso con Ctrl+Shift+R, porque el iframe del Add-In dentro de
       MyGeotab no siempre repite la recarga forzada para sus propios
       recursos). Subir el número (o poner la fecha del cambio) en este
       archivo fuerza a bajar la versión nueva de todos los .js/.css. -->
</head>
<body>
  <div id="gd-root">
    <nav id="gd-nav">
      <div class="gd-nav-title">Gestión Documental</div>

      <button data-view="indicadores" class="gd-nav-btn active">Indicadores</button>

      <div class="gd-nav-section">Documentos</div>
      <button data-view="entidades" class="gd-nav-btn">Entidades</button>
      <button data-view="eliminados" class="gd-nav-btn">Eliminados</button>

      <div class="gd-nav-section">Notificaciones</div>
      <button data-view="alertas" class="gd-nav-btn">Alertas</button>
      <button data-view="reportes" class="gd-nav-btn">Reportes</button>

      <div class="gd-nav-section">Configuración</div>
      <button data-view="tiposDocumento" class="gd-nav-btn">Tipos de Documento</button>
      <button data-view="funciones" class="gd-nav-btn">Funciones</button>
      <button data-view="usuarios" class="gd-nav-btn">Choferes</button>
      <button data-view="auditoria" class="gd-nav-btn">Auditoría</button>

      <button id="gd-btn-sync" class="gd-nav-btn" style="margin-top:8px;margin-right:0;border-radius:0;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;">⟳ Sincronizar con Geotab</button>
      <div class="gd-nav-status" id="gd-auth-status">Conectando…</div>
    </nav>
    <main id="gd-content">Cargando…</main>
  </div>

  <script src="js/firebase-config.js?v=3"></script>
  <script src="js/data/store.js?v=3"></script>
  <script src="js/geotab-api.js?v=3"></script>
  <script src="js/views/indicadores.js?v=3"></script>
  <script src="js/views/entidades.js?v=3"></script>
  <script src="js/views/eliminados.js?v=3"></script>
  <script src="js/views/alertas.js?v=3"></script>
  <script src="js/views/reportes.js?v=3"></script>
  <script src="js/views/tiposDocumento.js?v=3"></script>
  <script src="js/views/funciones.js?v=3"></script>
  <script src="js/views/usuarios.js?v=3"></script>
  <script src="js/views/auditoria.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
