<!-- Gestion de Viajes DP - App del chofer (MyGeotab Drive) -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Viaje</title>
</head>
<body>
<div id="gv-app">
<div id="gv-style-container"></div>
<div id="gv-header"><img src="https://axel-valle-22.github.io/geotab-gestion-viajes/logo-tdp.png" alt="Transportes Dolores Parra" style="height:44px;margin-bottom:8px;display:block">
<h1>Mi Viaje</h1>
<p>DoloresParra S.A. - Chofer</p>
</div>
<div id="gv-select-driver-box" class="gv-select-driver" style="display:none">
<label>No se detecto automaticamente tu usuario. Seleccioná tu nombre para continuar:</label>
<select id="gv-select-driver"><option value="">Seleccionar...</option></select>
</div>
<div id="gv-driver-content">
<p style="text-align:center;color:#6b7280;padding:40px">Cargando tus viajes...</p>
</div>
</div>
<script src="common.js"></script>
<script>
(function(){
'use strict';

var gApi = null;
var gDriver = null;
var gConductores = [];
var gPollTimer = null;
var gSessionUserName = null;

function puedeIniciar(v){
var g = v.gerenciamiento;
if(!g || !g.resultado) return false;
if(g.autorizadoPor === 'supervisor') return true;
if(g.resultado === 'rojo') return false;
if(g.resultado === 'verde') return true;
return false;
}

function misViajes(){
if(!gDriver) return [];
return GV.Storage.getViajes().filter(function(v){ return v.conductorId === gDriver.id && v.estado !== 'cancelado'; });
}

function renderDriverView(){
var box = document.getElementById('gv-driver-content');
if(!box) return;
if(!gDriver){
box.innerHTML = '<p style="text-align:center;color:#6b7280;padding:40px">Seleccioná tu nombre arriba para ver tus viajes.</p>';
return;
}
var viajes = misViajes().sort(function(a,b){ return new Date(a.fechaSalida) - new Date(b.fechaSalida); });
var pendientes = viajes.filter(function(v){ return v.estado === 'planificado' || v.estado === 'demorado'; });
var enCurso = viajes.filter(function(v){ return v.estado === 'en_curso'; });
var historial = viajes.filter(function(v){ return v.estado === 'completado'; }).slice(-5).reverse();

var html = '';

enCurso.concat(pendientes).forEach(function(v){
html += renderViajeCard(v);
});

if(!enCurso.length && !pendientes.length){
html += '<p style="text-align:center;color:#6b7280;padding:40px">No tenes viajes programados por el momento.</p>';
}

if(historial.length){
html += '<h3 style="color:#6b7280;font-size:.9rem;margin:20px 0 10px">Viajes completados recientes</h3>';
historial.forEach(function(v){ html += renderViajeCard(v, true); });
}

box.innerHTML = html;

box.querySelectorAll('[data-action="gerenciar"]').forEach(function(btn){
btn.addEventListener('click', function(){ abrirWizard(btn.getAttribute('data-id')); });
});
box.querySelectorAll('[data-action="iniciar"]').forEach(function(btn){
btn.addEventListener('click', function(){
GV.Storage.updateViaje(btn.getAttribute('data-id'), { estado: 'en_curso', iniciadoEn: new Date().toISOString() }).then(function(){ renderDriverView(); });
});
});
box.querySelectorAll('[data-action="completar"]').forEach(function(btn){
btn.addEventListener('click', function(){
GV.Storage.updateViaje(btn.getAttribute('data-id'), { estado: 'completado', completadoEn: new Date().toISOString() }).then(function(){ renderDriverView(); });
});
});
box.querySelectorAll('[data-action="detalle"]').forEach(function(btn){
btn.addEventListener('click', function(){ abrirDetalleViajeChofer(btn.getAttribute('data-id')); });
});
  box.querySelectorAll('[data-action="llegada-sitio"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      var site = btn.getAttribute('data-site');
      var v = GV.Storage.getViaje(id);
      if(!v) return;
      var sr = Object.assign({}, v.sitiosReal || {});
      if(!sr[site]) sr[site] = {};
      sr[site].ingreso = new Date().toISOString();
      GV.Storage.updateViaje(id, { sitiosReal: sr }).then(function(){ renderDriverView(); });
    });
  });
  box.querySelectorAll('[data-action="salida-sitio"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      var site = btn.getAttribute('data-site');
      var v = GV.Storage.getViaje(id);
      if(!v) return;
      var sr = Object.assign({}, v.sitiosReal || {});
      if(!sr[site]) sr[site] = {};
      sr[site].egreso = new Date().toISOString();
      GV.Storage.updateViaje(id, { sitiosReal: sr }).then(function(){ renderDriverView(); });
    });
  });
  box.querySelectorAll('[data-action="demorado"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      var v = GV.Storage.getViaje(id);
      if(!v) return;
      if(!window.confirm('¿Confirmas que queres reportar una demora? Se va a notificar al coordinador.')) return;
      var paradas = paradasConTipo(v);
      var actual = paradas.find(function(p){ return estadoSitio(v, p.id) === 'en_sitio'; });
      var lugar = actual ? (GV.tipoParadaLabel(actual.tipo) + ' en ' + (actual.direccion || '')) : 'en el recorrido';
      GV.Storage.addAlerta({
        id: 'al_demora_manual_' + id + '_' + Date.now(),
        tipo: 'demora_manual',
        mensaje: v.conductor + ' - ' + v.vehiculo + ': reporto una demora manualmente (' + lugar + ').',
        fecha: new Date().toISOString(),
        viajeId: id
      }).then(function(){
        btn.disabled = true;
        btn.textContent = 'Demora reportada';
      });
    });
  });
}

/* Estas cuatro funciones estaban antes anidadas dentro de renderDriverView(), por lo que
   renderViajeCard() (una funcion separada, definida al mismo nivel que renderDriverView)
   no tenia acceso a renderProgresoSitios: quedaba fuera de su alcance lexico. Eso rompia
   con "ReferenceError: renderProgresoSitios is not defined" cada vez que se armaba la
   tarjeta de un viaje en curso, lo que abortaba todo el renderDriverView() antes de llegar
   a box.innerHTML = html - por eso no se veian los viajes en la app del chofer. Se las
   saca a nivel superior para que ambas funciones puedan usarlas. */
function paradasConTipo(v){
  return (v.paradas || []).map(function(p, i){ return { id: 'parada' + i, idx: i, tipo: p.tipo, direccion: p.direccion, duracionMin: p.duracionMin }; }).filter(function(p){ return !!p.tipo; });
}

function estadoSitio(v, siteId){
  var sr = (v.sitiosReal && v.sitiosReal[siteId]) || null;
  if(!sr || !sr.ingreso) return 'pendiente';
  if(!sr.egreso) return 'en_sitio';
  return 'completado';
}

function horaDe(iso){
  if(!iso) return '';
  var f = GV.fmtDate(iso);
  var partes = f.split(' ');
  return partes.length > 1 ? partes[1] : f;
}

function renderProgresoSitios(v){
  var paradas = paradasConTipo(v);
  if(!paradas.length) return '';
  var currentIdx = -1;
  var rows = paradas.map(function(p, idx){
    var estado = estadoSitio(v, p.id);
    if(estado !== 'completado' && currentIdx === -1) currentIdx = idx;
    var sr = (v.sitiosReal && v.sitiosReal[p.id]) || {};
    var estadoTxt = estado === 'completado' ? ('Completado ' + horaDe(sr.ingreso) + (sr.egreso ? ('-' + horaDe(sr.egreso)) : '')) : (estado === 'en_sitio' ? ('En sitio desde ' + horaDe(sr.ingreso)) : 'Pendiente');
    var estadoColor = estado === 'completado' ? '#059669' : (estado === 'en_sitio' ? '#d97706' : '#9ca3af');
    return '<div class="gv-stop-item"><span class="gv-stop-badge gv-' + p.tipo + '">' + GV.tipoParadaLabel(p.tipo) + '</span><span>' + GV.escapeHtml(p.direccion || '') + '</span><span style="margin-left:auto;font-size:.76rem;font-weight:600;color:' + estadoColor + ';white-space:nowrap">' + estadoTxt + '</span></div>';
  }).join('');
  var actionBtn = '';
  if(currentIdx !== -1){
    var cp = paradas[currentIdx];
    var est = estadoSitio(v, cp.id);
    if(est === 'pendiente'){
      actionBtn = '<button class="gv-btn gv-btn-primary gv-btn-sm" data-action="llegada-sitio" data-id="' + v.id + '" data-site="' + cp.id + '">Llegue - Iniciar ' + GV.tipoParadaLabel(cp.tipo) + '</button>';
    } else if(est === 'en_sitio'){
      actionBtn = '<button class="gv-btn gv-btn-suc gv-btn-sm" data-action="salida-sitio" data-id="' + v.id + '" data-site="' + cp.id + '">Sali - Termine ' + GV.tipoParadaLabel(cp.tipo) + '</button>';
    }
  }
  return '<div class="gv-sitios-progreso" style="margin-top:10px">' +
    '<h4 style="margin:0 0 8px;font-size:.8rem;color:#6b7280;font-weight:700">Paradas del recorrido</h4>' +
    rows +
    (actionBtn ? '<div class="gv-trip-actions" style="margin-top:8px;justify-content:flex-start">' + actionBtn + '</div>' : '') +
    '</div>';
}

function renderViajeCard(v, compact){
var g = v.gerenciamiento;
var origenTxt = v.origen ? v.origen.direccion : '';
var destinoTxt = v.destino ? v.destino.direccion : '';
var stops = (v.paradas || []).map(function(p){
return '<span class="gv-stop-chip gv-' + p.tipo + '">' + GV.tipoParadaLabel(p.tipo) + ': ' + GV.escapeHtml(p.direccion) + ' (' + p.duracionMin + ' min)</span>';
}).join('');

var banner = '';
var actions = '';
  var progreso = '';

if(!compact){
if(v.estado === 'en_curso'){
progreso = renderProgresoSitios(v);
  actions = '<button class="gv-btn gv-btn-warn gv-btn-sm" data-action="demorado" data-id="' + v.id + '">Estoy Demorado</button>' +
    '<button class="gv-btn gv-btn-primary gv-btn-sm" data-action="completar" data-id="' + v.id + '">Completar Viaje</button>';
} else {
  /* Ningun viaje puede iniciar sin gerenciamiento: mientras el viaje no este autorizado a salir,
     la opcion de hacer (o rehacer) el gerenciamiento tiene que seguir disponible siempre. */
  var autorizado = puedeIniciar(v);
  if(!g || !g.resultado){
    banner = '<div class="gv-banner gv-banner-info"><h3>Tenes un viaje programado</h3><p>Antes de iniciar, debes completar el Gerenciamiento de Viaje (obligatorio).</p></div>';
  } else if(autorizado){
    banner = '<div class="gv-banner gv-banner-ok"><h3>Autorizado para viajar</h3><p>Ya podes iniciar el viaje.</p></div>';
  } else if(g.resultado === 'amarillo' && g.rechazado){
    banner = '<div class="gv-banner gv-banner-danger"><h3>Solicitud rechazada</h3><p>El supervisor rechazo la autorizacion. Podes rehacer el gerenciamiento o contactate para reprogramar el viaje.</p></div>';
  } else if(g.resultado === 'amarillo'){
    banner = '<div class="gv-banner gv-banner-warn"><h3>Esperando autorizacion del supervisor</h3><p>No podes salir hasta recibir la aprobacion. Esta pantalla se actualiza automaticamente.</p></div>';
  } else if(g.resultado === 'rojo' && g.rechazado){
    banner = '<div class="gv-banner gv-banner-danger"><h3>Solicitud rechazada</h3><p>El supervisor rechazo la autorizacion para viajar pese al resultado en rojo. Podes rehacer el gerenciamiento o contactate para reprogramar el viaje.</p></div>';
  } else if(g.resultado === 'rojo'){
    banner = g.solicitoAutorizacion
      ? '<div class="gv-banner gv-banner-warn"><h3>Esperando autorizacion del supervisor</h3><p>Se solicito autorizacion para viajar pese al resultado en rojo del gerenciamiento. Esta pantalla se actualiza automaticamente.</p></div>'
      : '<div class="gv-banner gv-banner-danger"><h3>NO ESTAS AUTORIZADO A VIAJAR</h3><p>' + GV.escapeHtml((g.motivos||[]).join('; ')) + '</p></div>';
  }
  if(autorizado){
    actions = '<button class="gv-btn gv-btn-suc gv-btn-sm" data-action="iniciar" data-id="' + v.id + '">Iniciar Viaje</button>';
  } else {
    actions = '<button class="gv-btn gv-btn-primary gv-btn-sm" data-action="gerenciar" data-id="' + v.id + '">' + ((!g || !g.resultado) ? 'Iniciar Gerenciamiento de Viaje' : 'Rehacer Gerenciamiento de Viaje') + '</button>';
  }
}
}

actions += '<button class="gv-btn gv-btn-sec gv-btn-sm" data-action="detalle" data-id="' + v.id + '">Ver Detalle</button>';

return '<div class="gv-driver-trip">' + banner +
'<div class="gv-trip-header"><div class="gv-trip-title">' + GV.escapeHtml(v.vehiculo||'?') + '</div><span class="gv-status gv-s-' + v.estado + '">' + GV.statusLabel(v.estado) + '</span></div>' +
'<div class="gv-trip-info">' + GV.fmtDate(v.fechaSalida) + ' &nbsp;|&nbsp; ' + GV.fmtRuta(origenTxt, destinoTxt) + '</div>' +
(stops ? '<div class="gv-stops">' + stops + '</div>' : '') +
(v.observaciones ? '<div style="font-size:.82rem;color:#6b7280;margin-top:6px;font-style:italic">' + GV.escapeHtml(v.observaciones) + '</div>' : '') +
  progreso +
(actions ? '<div class="gv-trip-actions">' + actions + '</div>' : '') +
'</div>';
}

/* ---------------- Detalle del viaje (mapa con sitios de carga/descarga) ---------------- */
function abrirDetalleViajeChofer(id){
var v = GV.Storage.getViaje(id);
if(!v) return;

function puntoRow(badgeColor, badgeTxt, titulo, direccion, extra){
return '<div class="gv-stop-item" style="align-items:flex-start">' +
'<div class="gv-site-marker-lbl" style="background:' + badgeColor + ';flex-shrink:0">' + badgeTxt + '</div>' +
'<span><b>' + GV.escapeHtml(titulo) + '</b><br><span style="color:#6b7280">' + GV.escapeHtml(direccion || 'Sin direccion') + (extra ? ' &nbsp;&middot;&nbsp; ' + GV.escapeHtml(extra) : '') + '</span></span>' +
'</div>';
}

var puntosHtml = '';
if(v.origen){
puntosHtml += puntoRow('#059669', 'O', 'Origen' + (v.origen.tipo ? ' - ' + GV.tipoParadaLabel(v.origen.tipo) : ''), v.origen.direccion);
}
(v.paradas || []).forEach(function(p, i){
puntosHtml += puntoRow('#d97706', String(i+1), (i+1) + '. ' + GV.tipoParadaLabel(p.tipo), p.direccion, p.duracionMin != null ? (p.duracionMin + ' min') : null);
});
if(v.destino){
puntosHtml += puntoRow('#dc2626', 'D', 'Destino' + (v.destino.tipo ? ' - ' + GV.tipoParadaLabel(v.destino.tipo) : ''), v.destino.direccion);
}
if(!puntosHtml){
puntosHtml = '<p style="color:#6b7280;font-size:.85rem">No hay sitios cargados para este viaje.</p>';
}

var overlay = document.createElement('div');
overlay.className = 'gv-modal-overlay';
overlay.innerHTML =
'<div class="gv-modal" style="max-width:620px">' +
'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px">' +
'<h3 style="margin:0">' + GV.escapeHtml(v.vehiculo||'?') + '</h3>' +
'<button type="button" class="gv-btn gv-btn-sec gv-btn-sm" id="gv-cdet-close">Cerrar</button>' +
'</div>' +
'<div style="font-size:.85rem;color:#6b7280;margin:4px 0 14px">' + GV.statusLabel(v.estado||'planificado') + ' &nbsp;|&nbsp; Salida: ' + GV.fmtDate(v.fechaSalida) + '</div>' +
'<div id="gv-cdet-map" class="gv-map-box" style="height:300px"></div>' +
'<div id="gv-cdet-puntos" style="margin-top:4px">' + puntosHtml + '</div>' +
(v.observaciones ? ('<div style="font-size:.82rem;color:#6b7280;margin-top:10px;font-style:italic">' + GV.escapeHtml(v.observaciones) + '</div>') : '') +
'</div>';
document.body.appendChild(overlay);

var closeBtn = document.getElementById('gv-cdet-close');
if(closeBtn) closeBtn.addEventListener('click', function(){ overlay.remove(); });
overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.remove(); });

var puntos = [];
if(v.origen && typeof v.origen.lat === 'number') puntos.push({ lat: v.origen.lat, lng: v.origen.lng, color: '#059669', label: 'O', tooltip: 'Origen: ' + (v.origen.direccion || '') });
(v.paradas || []).forEach(function(p, i){
if(typeof p.lat === 'number') puntos.push({ lat: p.lat, lng: p.lng, color: '#d97706', label: String(i+1), tooltip: (i+1) + '. ' + GV.tipoParadaLabel(p.tipo) + ': ' + (p.direccion || '') });
});
if(v.destino && typeof v.destino.lat === 'number') puntos.push({ lat: v.destino.lat, lng: v.destino.lng, color: '#dc2626', label: 'D', tooltip: 'Destino: ' + (v.destino.direccion || '') });

if(!puntos.length){
var mapBox = document.getElementById('gv-cdet-map');
if(mapBox) mapBox.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7280;font-size:.85rem;text-align:center;padding:0 16px">No hay ubicaciones cargadas en el mapa para este viaje.</div>';
return;
}

GV.loadLeaflet().then(function(L){
if(!document.body.contains(overlay)) return;
var map = L.map('gv-cdet-map').setView([puntos[0].lat, puntos[0].lng], 13);
GV.addBaseLayers(map);
var layer = L.layerGroup().addTo(map);
var bounds = [];

puntos.forEach(function(pt){
var icon = L.divIcon({ className: '', html: '<div class="gv-site-marker-lbl" style="background:' + pt.color + '">' + pt.label + '</div>', iconSize: [26,26], iconAnchor: [13,13] });
L.marker([pt.lat, pt.lng], { icon: icon, zIndexOffset: 500 }).bindTooltip(pt.tooltip).addTo(layer);
bounds.push([pt.lat, pt.lng]);
});

if(bounds.length > 1){
var fallbackLine = L.polyline(bounds, { color: '#00A6E0', weight: 3, opacity: .5, dashArray: '6,6' }).addTo(layer);
GV.getRoute(puntos.map(function(p){ return { lat: p.lat, lng: p.lng }; })).then(function(route){
if(!document.body.contains(overlay)) return;
if(route && route.coords && route.coords.length > 1){
layer.removeLayer(fallbackLine);
L.polyline(route.coords, { color: '#00A6E0', weight: 4, opacity: .8 }).addTo(layer);
}
});
map.fitBounds(bounds, { padding: [30,30] });
}

setTimeout(function(){ try{ map.invalidateSize(); }catch(e){} }, 100);
});
}

/* ---------------- Wizard de Gerenciamiento de Viaje ---------------- */
function abrirWizard(viajeId){
var viaje = GV.Storage.getViaje(viajeId);
if(!viaje) return;

var respuestas = {
durmioPoco: null, horasDespiertoMas16: null, alcoholMedicacion: null, noApto: null,
motivo: null, motivoOtro: '',
checklist: { alarmaRetroceso: null, kitAntiderrame: null, parabrisas: null, espejos: null, neumaticos: null, verificacion360: null },
checklistObs: '',
clima: null, rutaConocida: null, comunicacion: null,
fatiga: null
};

/* Indica si, para una pregunta si/no del wizard, contestar "si" es la respuesta buena (verde) o
   la mala (rojo). En el aviso de seguridad vial son preguntas capciosas: contestar "si" es malo.
   En el checklist vehicular y en la evaluacion de riesgos es al reves: "si" es lo esperado/bueno. */
function siEsPositivo(q){
if(q.indexOf('chk_') === 0) return true;
if(q === 'rutaConocida' || q === 'comunicacion') return true;
return false;
}
function claseParaRespuesta(q, v){
var esBueno = (v === 'si') === siEsPositivo(q);
return esBueno ? 'gv-r-yes-sel' : 'gv-r-no-sel';
}

var steps = ['aviso', 'motivo', 'checklist', 'riesgos', 'fatiga', 'resultado'];
var stepIdx = 0;

var overlay = document.createElement('div');
overlay.className = 'gv-modal-overlay';
overlay.innerHTML = '<div class="gv-modal" id="gv-wizard-modal"></div>';
document.body.appendChild(overlay);
var modal = overlay.querySelector('#gv-wizard-modal');

function progressHtml(){
var n = steps.length - 1;
var html = '<div class="gv-wizard-progress">';
for(var i=0;i<n;i++){ html += '<span class="' + (i <= stepIdx ? 'gv-done' : '') + '"></span>'; }
return html + '</div>';
}

function renderStep(){
var body = '';
if(steps[stepIdx] === 'aviso'){
body = '<h3>Aviso de seguridad vial</h3>' +
'<div class="gv-banner gv-banner-warn"><p>El conductor debera notificar a su supervisor y NO REALIZAR EL VIAJE si:</p></div>' +
'<div class="gv-check-row"><span>Dormiste menos de 6 horas la jornada anterior</span><div class="gv-radio-pair" data-q="durmioPoco"><button data-v="si">Si</button><button data-v="no">No</button></div></div>' +
'<div class="gv-check-row"><span>Llevas despierto o de viaje mas de 16 horas</span><div class="gv-radio-pair" data-q="horasDespiertoMas16"><button data-v="si">Si</button><button data-v="no">No</button></div></div>' +
'<div class="gv-check-row"><span>Consumiste alcohol o medicacion/drogas que afecten tus reflejos en las ultimas 12 horas</span><div class="gv-radio-pair" data-q="alcoholMedicacion"><button data-v="si">Si</button><button data-v="no">No</button></div></div>' +
'<div class="gv-check-row"><span>Consideras que no estas apto para realizar el viaje</span><div class="gv-radio-pair" data-q="noApto"><button data-v="si">Si</button><button data-v="no">No</button></div></div>';
} else if(steps[stepIdx] === 'motivo'){
var motivos = ['Viaje a un puesto de trabajo','Visita a un cliente','Transporte de personal','Transporte de carga o acarreo','Fin de la jornada laboral'];
body = '<h3>Indica un motivo de viaje</h3><div class="gv-motivo-list">' +
motivos.map(function(m){
return '<label><input type="radio" name="gv-motivo" value="' + m + '"' + (respuestas.motivo === m ? ' checked' : '') + '> ' + m + '</label>';
}).join('') +
'<label>Es por otro motivo:<input type="text" id="gv-motivo-otro" placeholder="Escribi el motivo..." value="' + GV.escapeHtml(respuestas.motivoOtro) + '"></label>' +
'</div>';
} else if(steps[stepIdx] === 'checklist'){
var items = [
['alarmaRetroceso','Alarma de retroceso'], ['kitAntiderrame','Kit antiderrame'],
['parabrisas','Parabrisas en condiciones'], ['espejos','Espejos retrovisores en condiciones'],
['neumaticos','Neumaticos en condiciones'], ['verificacion360','Verificacion 360 del vehiculo confirmando ausencia de situaciones de riesgo']
];
body = '<h3>Controles y Checklist Vehicular<span class="gv-req">*</span></h3>' +
items.map(function(it){
return '<div class="gv-check-row"><span>' + it[1] + '</span><div class="gv-radio-pair" data-q="chk_' + it[0] + '"><button data-v="si">Si</button><button data-v="no">No</button></div></div>';
}).join('') +
'<div class="gv-form-row" style="margin-top:10px"><label>Observacion adicional</label><textarea id="gv-checklist-obs" rows="2">' + GV.escapeHtml(respuestas.checklistObs) + '</textarea></div>';
} else if(steps[stepIdx] === 'riesgos'){
var climas = ['Soleado / nublado','Lluvia / barro / viento','Tormentas fuertes / niebla','Nieve / heladas'];
body = '<h3>Evaluacion de Riesgos<span class="gv-req">*</span></h3><div class="gv-motivo-list">' +
climas.map(function(c){ return '<label><input type="radio" name="gv-clima" value="' + c + '"' + (respuestas.clima === c ? ' checked' : '') + '> ' + c + '</label>'; }).join('') +
'</div>' +
'<div class="gv-check-row"><span>Conoces la ruta a recorrer</span><div class="gv-radio-pair" data-q="rutaConocida"><button data-v="si">Si</button><button data-v="no">No</button></div></div>' +
'<div class="gv-check-row"><span>Contas con comunicacion disponible (radio/celular)</span><div class="gv-radio-pair" data-q="comunicacion"><button data-v="si">Si</button><button data-v="no">No</button></div></div>';
} else if(steps[stepIdx] === 'fatiga'){
body = '<h3>Diagnostico de Fatiga<span class="gv-req">*</span></h3>' +
'<p style="font-size:.88rem;color:#374151;margin:0 0 12px">Indique su nivel de cansancio en este momento</p>' +
'<div class="gv-fatiga-list">' +
'<label class="gv-fatiga-alto"><input type="radio" name="gv-fatiga" value="alto"' + (respuestas.fatiga === 'alto' ? ' checked' : '') + '> 1. Extremadamente cansado (Riesgo Alto)</label>' +
'<label class="gv-fatiga-medio"><input type="radio" name="gv-fatiga" value="medio"' + (respuestas.fatiga === 'medio' ? ' checked' : '') + '> 2. Un poco cansado (Riesgo Medio)</label>' +
'<label class="gv-fatiga-verde"><input type="radio" name="gv-fatiga" value="verde"' + (respuestas.fatiga === 'verde' ? ' checked' : '') + '> 3. Completamente alerta (Riesgo Verde)</label>' +
'</div>';
} else if(steps[stepIdx] === 'resultado'){
var r = calcularResultado();
var cls = r.resultado === 'verde' ? 'gv-result-verde' : (r.resultado === 'amarillo' ? 'gv-result-amarillo' : 'gv-result-rojo');
var titulo = r.resultado === 'verde' ? 'Gerenciamiento Verde' : (r.resultado === 'amarillo' ? 'Gerenciamiento Amarillo' : 'Gerenciamiento Rojo');
var msg = r.resultado === 'verde' ? 'Autorizacion automatica: podes salir inmediatamente sin esperar aprobacion.' :
r.resultado === 'amarillo' ? 'Requiere autorizacion del supervisor: no podes salir hasta recibir la aprobacion.' :
'El sistema bloqueo el viaje automaticamente. NO ESTAS AUTORIZADO A VIAJAR.';
body = '<div class="gv-result-box ' + cls + '"><h2>' + titulo + '</h2><p>' + msg + '</p>' +
(r.motivos.length ? '<p style="font-size:.85rem;margin-top:10px">' + GV.escapeHtml(r.motivos.join(' | ')) + '</p>' : '') + '</div>';
}
modal.innerHTML = progressHtml() + body + '<div class="gv-modal-actions" id="gv-wizard-actions"></div>';
wireStep();
}

function wireStep(){
modal.querySelectorAll('.gv-radio-pair').forEach(function(pair){
var q = pair.getAttribute('data-q');
var val = q.indexOf('chk_') === 0 ? respuestas.checklist[q.slice(4)] : respuestas[q];
pair.querySelectorAll('button').forEach(function(b){
if(b.getAttribute('data-v') === val) b.classList.add(claseParaRespuesta(q, val));
});
pair.querySelectorAll('button').forEach(function(b){
b.addEventListener('click', function(){
var v = b.getAttribute('data-v');
if(q.indexOf('chk_') === 0){ respuestas.checklist[q.slice(4)] = v; } else { respuestas[q] = v; }
pair.querySelectorAll('button').forEach(function(x){ x.classList.remove('gv-r-yes-sel','gv-r-no-sel'); });
b.classList.add(claseParaRespuesta(q, v));
renderActions();
});
});
});

if(steps[stepIdx] === 'fatiga'){
modal.querySelectorAll('input[name="gv-fatiga"]').forEach(function(r){
r.addEventListener('change', function(){ respuestas.fatiga = r.value; renderActions(); });
});
}
if(steps[stepIdx] === 'motivo'){
modal.querySelectorAll('input[name="gv-motivo"]').forEach(function(r){
r.addEventListener('change', function(){ respuestas.motivo = r.value; renderActions(); });
});
var otro = document.getElementById('gv-motivo-otro');
if(otro) otro.addEventListener('input', function(){ respuestas.motivoOtro = otro.value; if(otro.value){ respuestas.motivo = 'Otro'; } renderActions(); });
}
if(steps[stepIdx] === 'checklist'){
var obs = document.getElementById('gv-checklist-obs');
if(obs) obs.addEventListener('input', function(){ respuestas.checklistObs = obs.value; });
}
if(steps[stepIdx] === 'riesgos'){
modal.querySelectorAll('input[name="gv-clima"]').forEach(function(r){
r.addEventListener('change', function(){ respuestas.clima = r.value; renderActions(); });
});
}

renderActions();
}

function stepValido(){
var s = steps[stepIdx];
if(s === 'aviso') return respuestas.durmioPoco && respuestas.horasDespiertoMas16 && respuestas.alcoholMedicacion && respuestas.noApto;
if(s === 'motivo') return !!respuestas.motivo;
if(s === 'checklist'){
var c = respuestas.checklist;
return Object.keys(c).every(function(k){ return c[k]; });
}
if(s === 'riesgos') return !!respuestas.clima && respuestas.rutaConocida && respuestas.comunicacion;
if(s === 'fatiga') return !!respuestas.fatiga;
return true;
}

function renderActions(){
var actions = document.getElementById('gv-wizard-actions');
if(!actions) return;
var isLast = steps[stepIdx] === 'resultado';
var resultadoActual = isLast ? calcularResultado() : null;
var html = '';
html += '<button type="button" class="gv-btn gv-btn-sec" id="gv-wizard-cancel">Cancelar</button>';
if(stepIdx > 0 && !isLast){ html += '<button type="button" class="gv-btn gv-btn-sec" id="gv-wizard-prev">Anterior</button>'; }
if(!isLast){
html += '<button type="button" class="gv-btn gv-btn-primary" id="gv-wizard-next"' + (stepValido() ? '' : ' disabled') + '>Continuar</button>';
} else if(resultadoActual.resultado === 'rojo'){
html += '<button type="button" class="gv-btn gv-btn-primary" id="gv-wizard-solicitar">Solicitar autorizacion</button>';
} else {
html += '<button type="button" class="gv-btn gv-btn-primary" id="gv-wizard-finish">Finalizar</button>';
}
actions.innerHTML = html;

var cancelBtn = document.getElementById('gv-wizard-cancel');
if(cancelBtn) cancelBtn.addEventListener('click', cerrarWizard);
var prevBtn = document.getElementById('gv-wizard-prev');
if(prevBtn) prevBtn.addEventListener('click', function(){ stepIdx--; renderStep(); });
var nextBtn = document.getElementById('gv-wizard-next');
if(nextBtn) nextBtn.addEventListener('click', function(){ if(stepValido()){ stepIdx++; renderStep(); } });
var finishBtn = document.getElementById('gv-wizard-finish');
if(finishBtn) finishBtn.addEventListener('click', function(){ finalizarWizard(false); });
var solicitarBtn = document.getElementById('gv-wizard-solicitar');
if(solicitarBtn) solicitarBtn.addEventListener('click', function(){ finalizarWizard(true); });
}

function calcularResultado(){
var motivos = [];
var rojo = false, amarillo = false;
if(respuestas.horasDespiertoMas16 === 'si'){ rojo = true; motivos.push('Horas despierto/conduccion superan el limite seguro'); }
if(respuestas.alcoholMedicacion === 'si'){ rojo = true; motivos.push('Consumo de alcohol o medicacion en las ultimas 12hs'); }
if(respuestas.noApto === 'si'){ rojo = true; motivos.push('El conductor declara no estar en condiciones de manejar'); }
if(respuestas.durmioPoco === 'si' && !rojo){ amarillo = true; motivos.push('Durmio menos de 6 horas'); }
var c = respuestas.checklist;
Object.keys(c).forEach(function(k){ if(c[k] === 'no'){ amarillo = true; motivos.push('Checklist vehicular con item en No: ' + k); } });
if(respuestas.clima === 'Tormentas fuertes / niebla' || respuestas.clima === 'Nieve / heladas'){ amarillo = true; motivos.push('Condicion climatica de riesgo: ' + respuestas.clima); }
if(respuestas.rutaConocida === 'no'){ amarillo = true; motivos.push('Ruta no conocida'); }
if(respuestas.comunicacion === 'no'){ amarillo = true; motivos.push('Sin comunicacion disponible'); }
if(respuestas.fatiga === 'alto'){ rojo = true; motivos.push('Diagnostico de fatiga: extremadamente cansado (riesgo alto)'); }
else if(respuestas.fatiga === 'medio' && !rojo){ amarillo = true; motivos.push('Diagnostico de fatiga: un poco cansado (riesgo medio)'); }

var resultado = rojo ? 'rojo' : (amarillo ? 'amarillo' : 'verde');
return { resultado: resultado, motivos: motivos };
}

function cerrarWizard(){ overlay.remove(); }

function finalizarWizard(solicitarAuth){
var r = calcularResultado();
  var ahora = new Date().toISOString();
var gerenciamiento = {
  resultado: r.resultado,
  motivos: r.motivos,
respuestas: respuestas,
completadoEn: ahora,
autorizadoPor: r.resultado === 'verde' ? 'auto' : null,
rechazado: false,
solicitoAutorizacion: !!(r.resultado === 'rojo' && solicitarAuth)
};
  var registro = {
  id: GV.genId('ger'),
  viajeId: viaje.id,
  conductorId: viaje.conductorId,
  conductor: viaje.conductor,
  vehiculo: viaje.vehiculo,
  fecha: ahora,
  resultado: r.resultado,
  motivos: r.motivos,
  respuestas: respuestas
};
GV.Storage.updateViaje(viaje.id, { gerenciamiento: gerenciamiento }).then(function(){
  GV.Storage.addGerenciamiento(registro);
if(r.resultado === 'amarillo'){
GV.Storage.addAlerta({
id: 'al_auth_' + viaje.id, tipo: 'autorizacion',
mensaje: 'Solicitud de autorizacion: ' + viaje.conductor + ' (' + viaje.vehiculo + ') - ' + r.motivos.join('; '),
fecha: new Date().toISOString(), viajeId: viaje.id
});
} else if(r.resultado === 'rojo' && solicitarAuth){
GV.Storage.addAlerta({
id: 'al_auth_rojo_' + viaje.id, tipo: 'autorizacion',
mensaje: 'Solicitud de autorizacion (gerenciamiento ROJO): ' + viaje.conductor + ' (' + viaje.vehiculo + ') - ' + r.motivos.join('; '),
fecha: new Date().toISOString(), viajeId: viaje.id
});
} else if(r.resultado === 'rojo'){
GV.Storage.addAlerta({
id: 'al_rojo_' + viaje.id, tipo: 'info',
mensaje: viaje.conductor + ' fue bloqueado para viajar (gerenciamiento rojo): ' + r.motivos.join('; '),
fecha: new Date().toISOString(), viajeId: viaje.id
});
}
cerrarWizard();
renderDriverView();
});
}

renderStep();
}

/* ---------------- Identificacion del chofer ---------------- */
function mostrarSelectorManual(mensaje){
var box = document.getElementById('gv-select-driver-box');
if(!box) return;
box.style.display = 'block';
var lbl = box.querySelector('label');
if(lbl && mensaje) lbl.textContent = mensaje;
}

function ocultarSelectorManual(){
  var box = document.getElementById('gv-select-driver-box');
  if(box) box.style.display = 'none';
}
  
  function poblarSelectManual(lista){
var sel = document.getElementById('gv-select-driver');
if(sel){
var ordenada = (lista || []).slice().sort(function(a,b){ return (a.nombre||'').localeCompare((b.nombre||''), 'es', { sensitivity: 'base' }); });
sel.innerHTML = '<option value="">Seleccionar...</option>' + ordenada.map(function(c){ return '<option value="' + c.id + '">' + GV.escapeHtml(c.nombre) + '</option>'; }).join('');
}
}

/* La app de Drive no tiene permiso para llamar a Get/User (devuelve "Bad request" tanto para
busquedas acotadas como para listar todos los conductores). Por eso el directorio de
conductores se sincroniza por afuera: el panel del coordinador (index.html) lo lee de Geotab
y lo publica en GV.Storage (Firebase), y esta app solo lo lee de ahi. */
function intentarIdentificarDesdeStorage(){
var lista = (GV.Storage.getConductores && GV.Storage.getConductores()) || [];
gConductores = lista;
if(gDriver){ ocultarSelectorManual(); return true; }
if(gSessionUserName && lista.length){
var match = lista.find(function(c){ return c.name && c.name.toLowerCase() === gSessionUserName.toLowerCase(); });
if(match){ gDriver = match; ocultarSelectorManual(); return true; }
}
poblarSelectManual(lista);
if(!lista.length){
mostrarSelectorManual('Todavía no se sincronizó la lista de conductores. Pedile a un coordinador que abra el panel "Gestión de Viajes" una vez, o esperá unos segundos y volvé a esta pantalla.');
} else if(!gSessionUserName){
mostrarSelectorManual('No se pudo obtener tu usuario de sesión. Seleccioná tu nombre para continuar:');
} else {
mostrarSelectorManual('Tu usuario de sesión ("' + gSessionUserName + '") no está en la lista de conductores sincronizada. Seleccioná tu nombre para continuar:');
}
return false;
}

function cargarConductoresYIdentificar(api, state){
return new Promise(function(resolve){
GV.getSession(api).then(function(session){
gSessionUserName = (session && session.userName) || null;
intentarIdentificarDesdeStorage();
resolve();
});
});
}

function setupEvents(){
var sel = document.getElementById('gv-select-driver');
if(sel){
sel.addEventListener('change', function(){
gDriver = gConductores.find(function(c){ return c.id === sel.value; }) || null;
renderDriverView();
});
}
}

function doInit(api, state){
if(window._gvInitDone === 'real') return; /* evita doble inicializacion si ya hubo una real */
window._gvInitDone = api ? 'real' : 'null';
gApi = api;
GV.injectCSS('gv-style-container');
setupEvents();

GV.Storage.init(api).then(function(){
if(api){
cargarConductoresYIdentificar(api, state).then(function(){ renderDriverView(); });
} else {
renderDriverView();
}
GV.Storage.onChange(function(){ if(api && !gDriver){ intentarIdentificarDesdeStorage(); } renderDriverView(); });
});

if(api){
gPollTimer = setInterval(function(){ GV.Storage.refresh().then(function(){ renderDriverView(); }); }, 20000);
}
}

window.initialize = function(api, state, callback){
doInit(api, state);
if(typeof callback === 'function') callback();
};

if(typeof geotab !== 'undefined' && geotab.addin){
geotab.addin.GestionViajesDPChofer = function(){
return {
initialize: function(api, state, callback){ doInit(api, state); if(typeof callback === 'function') callback(); },
focus: function(){}, blur: function(){}
};
};
}

setTimeout(function(){
if(typeof window._gvInitDone === 'undefined'){
doInit(null, null);
}
}, 800);

})();
</script>
